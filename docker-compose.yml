version: '3.8'

services:
  api:
    build: .
    ports: 
        - "8000:8000"
    environment:
        - DATABASE_URL=postgresql://postgres:password@db:5432/churn_db
    depends_on: 
        - db
    volumes:
        - ./models:/app/models
  db:
    image: postgres:15
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_DB: churn_db
    ports:
        - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

